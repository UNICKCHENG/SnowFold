# 苹果端实现路：单元测试（iOS 与 macOS）+ 真机巡游截图（iPhone 393/375、iPad、AX5）
# + macOS 窗口/弹层/设置窗口截图 + 正式打包证据（AppIcon.icns、Info.plist 图标键、lipo 架构）。
name: Apple shots

# 工作流已在 ui/apple 注册；只允许手动触发，推送不消耗 CI 次数。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'compile 只编译；full 编译、测试、截图、打包'
        type: choice
        required: true
        default: full
        options: [compile, full]

permissions:
  contents: read

concurrency:
  group: apple-shots-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target/apple
  CARGO_TERM_COLOR: always
  APPLE_ROOT: ${{ github.workspace }}/apps/apple
  SHOTS_DIR: ${{ github.workspace }}/.fullstack/impl/apple/shots
  PKG_DIR: ${{ github.workspace }}/.fullstack/impl/apple/package

jobs:
  apple:
    name: Tests, tours, Mac shots, package
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.96.0'
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 (peeled commit)
        with:
          workspaces: '. -> target/apple'
          shared-key: apple-ui-redesign

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Record runner environment
        run: |
          mkdir -p "$SHOTS_DIR" "$PKG_DIR"
          {
            echo "macOS: $(sw_vers --productVersion) ($(sw_vers --buildVersion))"
            xcodebuild -version
            echo "iOS runtimes:"
            xcrun simctl list runtimes -j | python3 -I -c 'import json,sys; [print("  ", r["identifier"], r["version"]) for r in json.load(sys.stdin)["runtimes"]]'
          } | tee "$SHOTS_DIR/runner-env.txt"

      - name: Build core (iOS arm64, iOS sim, macOS) and generate project
        run: bash apps/apple/scripts/build-core.sh

      - name: Compile all Apple targets and retain full logs
        shell: bash
        run: |
          set -uo pipefail
          defaults write com.apple.dt.Xcode IDEBuildingContinueBuildingAfterErrors -bool YES
          failed=0
          xcodebuild -project apps/apple/SnowFold.xcodeproj -scheme SnowFold-iOS \
            -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            -derivedDataPath "$APPLE_ROOT/.build/shots-ios" CODE_SIGNING_ALLOWED=YES build-for-testing \
            2>&1 | tee "$APPLE_ROOT/.build/build-ios-unit.log" || failed=1
          xcodebuild -project apps/apple/SnowFold.xcodeproj -scheme SnowFold-iOS-snapshots \
            -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            -derivedDataPath "$APPLE_ROOT/.build/shots-ios" CODE_SIGNING_ALLOWED=YES build-for-testing \
            2>&1 | tee "$APPLE_ROOT/.build/build-ios-tours.log" || failed=1
          xcodebuild -project apps/apple/SnowFold.xcodeproj -scheme SnowFold-macOS \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$APPLE_ROOT/.build/shots-mac" CODE_SIGNING_ALLOWED=YES build-for-testing \
            2>&1 | tee "$APPLE_ROOT/.build/build-macos.log" || failed=1
          exit "$failed"

      - name: Seed fixtures (long / negative / broken)
        if: ${{ inputs.mode != 'compile' }}
        run: bash apps/apple/scripts/seed-fixtures.sh

      - name: Create snowfold-apple simulators (393x852, 375x667, iPad 1180x820)
        if: ${{ inputs.mode != 'compile' }}
        run: |
          set -euo pipefail
          cat > /tmp/pick_devicetype.py <<'PY'
          import json, sys
          names = {t["name"] for t in json.load(sys.stdin)["devicetypes"]}
          for candidate in sys.argv[1:]:
              if candidate in names:
                  print(candidate)
                  break
          PY
          cat > /tmp/pick_runtime.py <<'PY'
          import json, sys
          runtimes = [r for r in json.load(sys.stdin)["runtimes"]
                      if r.get("platform") == "iOS" and r.get("isAvailable", True)]
          print(max(runtimes, key=lambda r: tuple(int(p) for p in r["version"].split(".")))["identifier"])
          PY
          cat > /tmp/pick_udid.py <<'PY'
          import json, sys
          target = sys.argv[1]
          devices = [d for rows in json.load(sys.stdin)["devices"].values() for d in rows]
          for device in devices:
              if device["name"] == target:
                  print(device["udid"])
                  break
          PY
          runtime=$(xcrun simctl list runtimes -j | python3 -I /tmp/pick_runtime.py)
          iphone_type=$(xcrun simctl list devicetypes -j | python3 -I /tmp/pick_devicetype.py \
            "iPhone 16" "iPhone 15" "iPhone 16 Pro" "iPhone 17" "iPhone 17 Pro")
          se_type=$(xcrun simctl list devicetypes -j | python3 -I /tmp/pick_devicetype.py \
            "iPhone SE (3rd generation)" "iPhone SE (2nd generation)" "iPhone 17e" "iPhone 16e")
          ipad_type=$(xcrun simctl list devicetypes -j | python3 -I /tmp/pick_devicetype.py \
            "iPad Air 11-inch (M3)" "iPad Air 11-inch (M4)" "iPad Air 11-inch (M2)" "iPad Air (5th generation)" "iPad Air" "iPad")
          echo "devices: ${iphone_type} / ${se_type} / ${ipad_type} (runtime ${runtime})"
          for sim in snowfold-apple-iphone snowfold-apple-iphone-se snowfold-apple-ipad; do
              xcrun simctl delete "$sim" 2>/dev/null || true
          done
          xcrun simctl create snowfold-apple-iphone "$iphone_type" "$runtime"
          xcrun simctl create snowfold-apple-iphone-se "$se_type" "$runtime"
          xcrun simctl create snowfold-apple-ipad "$ipad_type" "$runtime"
          iphone_udid=$(xcrun simctl list devices -j | python3 -I /tmp/pick_udid.py snowfold-apple-iphone)
          se_udid=$(xcrun simctl list devices -j | python3 -I /tmp/pick_udid.py snowfold-apple-iphone-se)
          ipad_udid=$(xcrun simctl list devices -j | python3 -I /tmp/pick_udid.py snowfold-apple-ipad)
          for udid in "$iphone_udid" "$se_udid" "$ipad_udid"; do
              xcrun simctl bootstatus "$udid" -b
              xcrun simctl status_bar "$udid" override --time "9:41" --batteryLevel 100 --batteryState charged --wifiBars 3
          done
          echo "SNOWFOLD_IPHONE_UDID=$iphone_udid" >> "$GITHUB_ENV"
          echo "SNOWFOLD_SE_UDID=$se_udid" >> "$GITHUB_ENV"
          echo "SNOWFOLD_IPAD_UDID=$ipad_udid" >> "$GITHUB_ENV"

      - name: iOS unit tests (SnowFoldTests-iOS)
        if: ${{ inputs.mode != 'compile' }}
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project apps/apple/SnowFold.xcodeproj -scheme SnowFold-iOS \
            -destination "platform=iOS Simulator,id=$SNOWFOLD_IPHONE_UDID" ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            -derivedDataPath "$APPLE_ROOT/.build/shots-ios" CODE_SIGNING_ALLOWED=YES test \
            2>&1 | tee "$APPLE_ROOT/.build/tests-ios.log" | tail -40

      - name: macOS unit tests (SnowFoldTests-macOS)
        if: ${{ inputs.mode != 'compile' }}
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project apps/apple/SnowFold.xcodeproj -scheme SnowFold-macOS \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$APPLE_ROOT/.build/shots-mac" CODE_SIGNING_ALLOWED=YES test \
            2>&1 | tee "$APPLE_ROOT/.build/tests-mac.log" | tail -40

      - name: iPhone, small iPhone and iPad full light/dark matrix (including AX5 and interactions)
        if: ${{ inputs.mode != 'compile' }}
        continue-on-error: true
        env:
          DERIVED_DATA: ${{ github.workspace }}/apps/apple/.build/shots-ios
          SNOWFOLD_SHOTS_DEST: ${{ env.SHOTS_DIR }}
        run: bash apps/apple/scripts/run-ios-matrix.sh "$SNOWFOLD_IPHONE_UDID" "$SNOWFOLD_SE_UDID" "$SNOWFOLD_IPAD_UDID"

      - name: iPhone home screen icon shot
        if: ${{ inputs.mode != 'compile' }}
        continue-on-error: true
        run: |
          xcrun simctl bootstatus "$SNOWFOLD_IPHONE_UDID" -b
          xcrun simctl terminate "$SNOWFOLD_IPHONE_UDID" app.snowfold 2>/dev/null || true
          sleep 4
          xcrun simctl io "$SNOWFOLD_IPHONE_UDID" screenshot "$SHOTS_DIR/icon-iphone-homescreen.png"

      - name: Expand the capture display and retain its original mode
        if: ${{ inputs.mode != 'compile' }}
        run: |
          original_mode=$(swift apps/apple/scripts/capture-display.swift)
          echo "SNOWFOLD_ORIGINAL_DISPLAY_MODE=$original_mode" >> "$GITHUB_ENV"

      - name: macOS window, dialog, settings and banner shots
        if: ${{ inputs.mode != 'compile' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          FIXTURE_ROOT="$APPLE_ROOT/.build/fixture-mac"
          mkdir -p "$FIXTURE_ROOT"
          ln -sfn "$APPLE_ROOT/.build/long-data-v2" "$FIXTURE_ROOT/long"
          ln -sfn "$APPLE_ROOT/.build/neg-data-v1" "$FIXTURE_ROOT/neg"
          ln -sfn "$APPLE_ROOT/.build/bad-data" "$FIXTURE_ROOT/bad"
          bash apps/apple/scripts/run-mac-shots.sh \
            "$APPLE_ROOT/.build/shots-mac/Build/Products/Debug/SnowFold.app" \
            "$SHOTS_DIR" "$FIXTURE_ROOT"

      - name: Package macOS app (universal, with capture hooks for evidence)
        if: ${{ inputs.mode != 'compile' }}
        run: SNOWFOLD_ACCEPTANCE_CAPTURE=1 bash apps/apple/scripts/package-macos.sh

      - name: Package evidence (icon, Info.plist, archs) and first screen from the real bundle
        if: ${{ inputs.mode != 'compile' }}
        run: |
          set -euo pipefail
          APP="$APPLE_ROOT/.build/package-macos/Build/Products/Release/SnowFold.app"
          {
            echo "== Contents/Resources AppIcon.icns =="
            ls -l "$APP/Contents/Resources" | grep -i icns || true
            echo "== Info.plist icon keys =="
            plutil -p "$APP/Contents/Info.plist" | grep -i -E "icon|CFBundleName|CFBundleDisplayName" || true
            echo "== architectures =="
            xcrun lipo -archs "$APP/Contents/MacOS/SnowFold"
            xcrun lipo -info "$APP/Contents/MacOS/SnowFold"
          } | tee "$PKG_DIR/package-evidence.txt"
          # 真包首屏：用打包出的 .app 启动并截总览（长数据、浅色、1080x720）
          FIXTURE_ROOT="$APPLE_ROOT/.build/fixture-mac"
          CAPTURE="$(mktemp -d "$HOME/Library/Containers/app.snowfold/Data/tmp/pkg.XXXXXX")"
          mkdir -p "$CAPTURE/long"
          cp -R "$FIXTURE_ROOT/long/." "$CAPTURE/long/"
          bash apps/apple/scripts/capture-mac-window.sh "$APP" "$CAPTURE/package-first-screen.png" \
            "$CAPTURE/long" 1080 720 light -SNOWFOLD_SHOT_TAB overview \
            > "$APPLE_ROOT/.build/package-first-screen.log" 2>&1
          if [ -f "$CAPTURE/package-first-screen.png" ]; then
            cp "$CAPTURE/package-first-screen.png" "$PKG_DIR/"
          else
            cp "$CAPTURE/package-first-screen.png.failure" "$PKG_DIR/" 2>/dev/null || true
          fi
          rm -rf "$CAPTURE"
          # zip 保留 .app 的执行权限与符号链接，供下载后直接打开。
          ditto -c -k --keepParent "$APP" "$PKG_DIR/SnowFold.app.zip"
          test -f "$APP/Contents/Resources/AppIcon.icns"
          test -f "$PKG_DIR/package-first-screen.png"

      - name: Shut down owned simulators
        if: ${{ always() && inputs.mode != 'compile' }}
        run: |
          if [ -n "${SNOWFOLD_ORIGINAL_DISPLAY_MODE:-}" ]; then
            swift apps/apple/scripts/capture-display.swift "$SNOWFOLD_ORIGINAL_DISPLAY_MODE"
          fi
          for udid in "${SNOWFOLD_IPHONE_UDID:-}" "${SNOWFOLD_SE_UDID:-}" "${SNOWFOLD_IPAD_UDID:-}"; do
            [ -n "$udid" ] && xcrun simctl shutdown "$udid" || true
          done
          xcrun simctl list devices | grep snowfold-apple || true

      - name: Upload shots, logs and package artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apple-ui-redesign
          path: |
            .fullstack/impl/apple/shots
            .fullstack/impl/apple/package
            dist/SnowFold-macos.dmg
            apps/apple/.build/*.log
          if-no-files-found: warn
          retention-days: 14
