name: CI

on:
  push:
    # Other branches are checked through their pull request; pushing them too would run CI twice.
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect changed platforms
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      desktop: ${{ steps.scope.outputs.desktop }}
      apple: ${{ steps.scope.outputs.apple }}
      android: ${{ steps.scope.outputs.android }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          event = os.environ['EVENT_NAME']
          head = os.environ['HEAD_SHA']
          base = os.environ.get('BASE_SHA') if event == 'pull_request' else os.environ.get('BEFORE_SHA')
          selected = dict.fromkeys(('desktop', 'apple', 'android'), event == 'workflow_dispatch')
          if event == 'workflow_dispatch' or not base or set(base) == {'0'}:
              command = ['git', 'ls-tree', '-r', '--name-only', '-z', head]
          else:
              comparison = f'{base}...{head}' if event == 'pull_request' else base
              command = ['git', 'diff', '--no-renames', '--name-only', '-z', comparison]
              if event != 'pull_request':
                  command.append(head)
          try:
              paths = subprocess.check_output(command, stderr=subprocess.PIPE).decode().split('\0')
          except subprocess.CalledProcessError:
              # A force push may remove the old commit from the fetched history.
              print('Comparison unavailable; checking every platform.')
              selected = dict.fromkeys(selected, True)
              paths = []
          for path in filter(None, paths):
              # Shared changes always exercise all four platforms.
              if (path.startswith(('core/', 'shared/', '.github/workflows/'))
                      or path in ('Cargo.toml', 'Cargo.lock')
                      or ('/' not in path and path.startswith('rust-toolchain'))):
                  selected = dict.fromkeys(selected, True)
              elif path.startswith('apps/desktop/'):
                  selected['desktop'] = True
              elif path.startswith('apps/apple/'):
                  selected['apple'] = True
              elif path.startswith('apps/android/'):
                  selected['android'] = True
              elif (path.startswith('docs/')
                      or Path(path).suffix.lower() in ('.md', '.rst', '.txt')
                      or Path(path).name.startswith(('LICENSE', 'COPYING', 'CHANGELOG'))):
                  pass
              else:
                  # Unknown build/configuration paths fail safely by checking every platform.
                  selected = dict.fromkeys(selected, True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for platform, enabled in selected.items():
                  output.write(f'{platform}={str(enabled).lower()}\n')
          print(selected)
          PY

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.96.0'
          components: rustfmt
      - name: Configure Windows x64 MSVC and SDK tools
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 (peeled commit)
        with:
          workspaces: '. -> target/ci'
          shared-key: desktop-check
      - name: Check formatting once (platform independent)
        if: runner.os == 'macOS'
        run: cargo fmt --check
      - run: cargo test --locked --workspace

  apple:
    name: Apple (iOS Simulator and macOS)
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.96.0'
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 (peeled commit)
        with:
          workspaces: '. -> target/ci'
          shared-key: apple-check
      - run: brew install xcodegen
      - run: bash apps/apple/scripts/build-core.sh
      - name: Select and boot an available iPhone simulator
        shell: bash
        run: |
          simulator=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(device["udid"] for runtime, entries in devices.items()
                     if ".iOS-" in runtime for device in entries
                     if device["name"].startswith("iPhone")))')
          xcrun simctl bootstatus "$simulator" -b
          echo "SNOWFOLD_SIMULATOR_ID=$simulator" >> "$GITHUB_ENV"
      - name: Build and test iOS Simulator
        run: >-
          xcodebuild -project apps/apple/SnowFold.xcodeproj -scheme SnowFold-iOS
          -destination "platform=iOS Simulator,id=$SNOWFOLD_SIMULATOR_ID"
          -derivedDataPath target/xcode-ios CODE_SIGNING_ALLOWED=NO test
      - name: Build and test macOS SwiftUI
        run: >-
          xcodebuild -project apps/apple/SnowFold.xcodeproj -scheme SnowFold-macOS
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath target/xcode-macos CODE_SIGNING_ALLOWED=NO test

  android:
    name: Android (unit tests, lint, debug APK)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/android-setup
      - name: Test, lint and assemble debug APK
        working-directory: apps/android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

  summary:
    name: CI Summary
    if: ${{ always() }}
    needs: [changes, desktop, apple, android]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful checks (unaffected platforms may be skipped)
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          jobs = json.loads(os.environ['NEEDS_JSON'])
          failed = [name for name, job in jobs.items()
                    if job['result'] not in ('success', 'skipped')]
          if failed:
              sys.exit(f'CI failed: {failed}')
          print('All required checks passed; unaffected platforms were skipped.')
          PY
