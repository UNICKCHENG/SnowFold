[workspace]
members = ["core", "apps/desktop", "core/bindgen"]
default-members = ["apps/desktop"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
uniffi = "=0.32.2"
